name: Sync latest.json fact pack

# W-Z92：展示页靠 latest.json 算出"最新成果"是哪一件；main 推了 fact pack 就该更新。
# 每周一 12:30 UTC 自动跑 `scripts/build-latest.mjs`，docs/latest.json 提交回 main。
# 手动派发：workflow_dispatch；任一侧 commit 都会自动出发起于 weekly refresh。

on:
  schedule:
    - cron: "30 12 * * 1"   # weekly Monday 12:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-latest
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebase onto upstream first (avoid non-fast-forward)
        run: |
          git config user.name "crossrealm-sync-bot"
          git config user.email "crossrealm-sync-bot@users.noreply.github.com"
          git pull --rebase origin main

      - name: Rebuild the fact pack
        run: |
          node scripts/build-latest.mjs
          if git diff --quiet -- docs/latest.json; then
            echo "no change — fact pack already in sync"
            exit 0
          fi


      - name: Commit and push (with retries)
        run: |
          git config user.name "crossrealm-sync-bot"
          git config user.email "crossrealm-sync-bot@users.noreply.github.com"

          if git diff --quiet -- docs/latest.json; then exit 0; fi
          git add docs/latest.json
          git commit -m "chore(latest): refresh the showcase fact pack from main"

          PUSH_OK=0
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD; then
              PUSH_OK=1
              break
            fi
            echo "push attempt $i failed; retrying after pull --rebase"
          done

          if [ "$PUSH_OK" != "1" ]; then
            echo "::error::Could not push fact pack after 3 attempts"
            exit 1
          fi
