name: Sync latest.json fact pack

# W-Z92：个人展示页「跨界纪元」卡片要的不是快照，是 main 上最新的真实数字。
# 每周一 12:30 UTC 重跑 scripts/build-latest.mjs，把 docs/latest.json 推回 main。
# 手工跑：workflow_dispatch（发版里程碑之后顺手点一下即可）。
on:
  schedule:
    - cron: "30 12 * * 1"   # weekly Monday 12:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-latest
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # git rev-list --count 需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild the fact pack
        run: node scripts/build-latest.mjs

      - name: Commit if anything moved
        run: |
          if git diff --quiet -- docs/latest.json; then
            echo "no change"
            exit 0
          fi
          git config user.name "crossrealm-sync-bot"
          git config user.email "crossrealm-sync-bot@users.noreply.github.com"
          git add docs/latest.json
          git commit -m "chore(latest): refresh the showcase fact pack from main"
          git push
