# 在线伙伴服务（server/）的独立门禁：Maven 编译 + 全部单测 + 全链路冒烟。
# 与前端 ci.yml 分离：前端门禁（lint→test→build→size→perf→e2e）本体完全不感知本目录，
# 这里单独守住 Java 侧的可构建性与整链装配。触发条件：动到 server/ 或本工作流自身才跑。
name: server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Temurin 21：与父 POM 的 java.version=17 向下兼容，且与本机验证环境（25）差距最小
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify (compile + tests)
        run: mvn -B -f server/pom.xml verify

      # 冒烟：四个实例真起真打，逐一验证"配置下发 → 服务注册 → 网关 lb:// 转发 → 遥测计数"。
      # 脚本使用 28xxx 端口段、跑完自动关停；ubuntu  runner 上 127.0.0.1 秒连秒拒，不会像开发机那样慢等。
      - name: Smoke (full stack boot + gateway routing + config delivery)
        run: pwsh -File "${{ github.workspace }}/server/scripts/smoke.ps1"

      # Redis 背板的限流（W-P10）：起 throwaway redis + 网关注入 redis backend，
      # 验证 70 条突发后 429 出现，再停 redis 验证 fail-open（永远放行）。
      # 这是唯一一处真打 Redis 的门禁 —— 以前只能手动跑，现在每次 server 变更都真验。
      - name: Redis-backed rate limiter (W-P10 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-redis-rate-limit.ps1"

      # Redis 背板的赛季缓存（W-S2）：throwaway redis + season-service spring.cache.type=redis，
      # 验证 /api/seasons/active 两次返回相同、键 seasons::active 存在且 TTL ≈ 300s、
      # 停 redis 报错、起 redis 恢复。真修过一次 final record + NON_FINAL 反序列化 bug。
      - name: Redis-backed season cache (W-S2 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-redis-season-cache.ps1"

      # Redis 背板的顾问队列（W-Z1）：throwaway redis + ai-service ai-service.jobs.backend=redis。
      # 无 LLM_API_KEY 时 worker 确定性地不配置失败 -> DEAD；
      # 验证提交 -> claim -> DEAD -> DLQ -> 死信白名单端点，且 ai:advisor:jobs/dlq 
      # 键真的存在（这是跨实例 at-least-once 投递的真实红绿灯）。
      - name: Redis-backed advisor queue (W-Z1 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-redis-advisor-queue.ps1"

      # Redis-backed leaderboard (W-Y5): throwaway redis + game-service leaderboard.backend=redis
      - name: Redis-backed leaderboard (W-Y5 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-redis-leaderboard.ps1"

      # Redis-backed trial leaderboard (W-Y6 切片3): throwaway redis + game-service trial.backend=redis
      - name: Redis-backed trial leaderboard (W-Y6 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-redis-trial.ps1"

      # Redis-backed presence store (W-Z-同游): throwaway redis + PRESENCE_BACKEND=redis
      # proves beat -> count -> SISMEMBER + raw redis wanderer -> SSE snapshot replay +
      # live pub/sub frame -> cross-instance restart sharing the same keys
      - name: Redis-backed presence store (W-Z-同游 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-presence-redis.ps1"

      # Redis-backed notification ledger (W-Z49): throwaway redis + spring.cache.type=redis
      # proves publish -> recent readback -> LLEN/HGET raw keys -> cross-instance B sees
      # the same row -> stats backend=redis
      - name: Redis-backed notification ledger (W-Z49 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-notify-redis.ps1"

      # Micrometer/Prometheus exposition (W-Z10): boot game-service locally,
      # push one boss_defeated event, scrape /actuator/prometheus and assert
      # game_telemetry_enqueued_total + jvm_memory_used_bytes + process_uptime_seconds.
      - name: Prometheus telemetry exposition (W-Z10 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-prometheus.ps1"

      # ai-service Micrometer/Prometheus exposition (W-Z12): game-service 同构。
      # 本地起 ai-service，验证 /actuator/prometheus 真实拉取到 JVM 基础指标；
      # 有 LLM_API_KEY 时真跑一轮 advisor chat —— ai_upstream_calls_total / prompt_tokens_total / cache_hit_ratio 出线。
      - name: AI service Prometheus metrics (W-Z12 verification)
        run: pwsh -File "${{ github.workspace }}/server/scripts/verify-prometheus-ai.ps1"
