# game-service 的集中下发配置（config-server 的 native 仓库里那一份）。
# 服务启动时通过 spring.config.import 拉取；下线 config-server 也能起（optional: 前缀）。
game-service:
  leaderboard:
    # 是否在启动时播种一批演示通关记录（方便离线联调排行榜）
    seed-demo-data: true
    # 排行榜默认展示的条数上限
    max-limit: 10
  trial:
    # 位面试炼榜（W-F3 切片6）：分数降序，与 Boss 榜那张"用时升序"的表是两回事
    # 是否在启动时播种一批演示成绩
    seed-demo-data: true
    # 出榜条数上限
    max-limit: 10
    # 内存里最多留多少条（超出后丢最老的一条 —— 不限容的内存榜就是内存泄漏）
    max-entries: 500
  telemetry:
    # 内存里最多缓存多少条遥测事件（超出后丢弃最老的一条）
    max-events: 500
  notify-mirror-enabled: true
  idempotency:
    # 幂等提交：X-Idempotency-Key 头（可选、仅 POST /api/leaderboard 与 /api/trials/runs）
    # memory（默认）= 本进程 LRU + TTL；redis = 跨实例共享台账（与 verify-notify-redis 同套验证思路）
    enabled: true
    backend: memory
    # 台账 TTL：超时后同 key 可以再次提交
    ttl-seconds: 600
    # 内存台账容量（LRU 逐出最旧）
    max-entries: 512
  version-note: "在线伙伴服务 —— 由 Spring Cloud 统一配置中心下发"
