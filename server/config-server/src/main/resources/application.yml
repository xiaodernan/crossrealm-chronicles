server:
  port: 8888
  shutdown: graceful

spring:
  lifecycle:
    # 关停时先停止接收新请求，再给在途请求最多 15 秒慢慢收尾（Linux/systemd 下生效）
    timeout-per-shutdown-phase: 15s
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # 本地原生模式：classpath:/config 目录作为配置仓库
          search-locations: classpath:/config

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,env
