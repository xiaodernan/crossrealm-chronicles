server:
  port: 8083
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  application:
    name: ai-service
  config:
    # 与 game/season 同一口径：配置中心不在就静默用本地默认值
    import: "optional:configserver:http://localhost:8888"

# 星轨顾问的本地默认（config-server 的 ai-service.yml 是同一套旋钮的上线版本）。
# 唯一不进配置中心的东西是 api-key：密钥只从进程环境变量进，
# 绝不落到配置仓库、镜像层、日志或任何响应体里。
ai-service:
  base-url: "${LLM_BASE_URL:https://wkapi.pro/v1}"
  model: "${LLM_MODEL:gpt-6-sol}"
  api-key: "${LLM_API_KEY:}"
  timeout: 20s
  max-retries: 2
  retry-base-ms: 200
  cache-ttl-seconds: 120
  cache-max-entries: 256
  max-question-chars: 400
  max-tokens: 320
  breaker-threshold: 4
  breaker-cooldown-ms: 15000
  # W-Z82/W-Z84 · 典籍叩问：BM25 检索注原典段落交给大模型。
  # limit = 喂给模型的原典段落数（封顶 6）；multihop 打开后「复合问题」按标点切子句，
  # 每子句补 2 条未被主检索覆盖的块（总数封顶 limit+2 且绝对 ≤ 6）；关掉即退回单步检索。
  lore:
    limit: 4
    multihop: true
  # W-Y4：慢速 LLM 调用的独立车道（有界队列 + 2 worker + 重试/死信）。
  # 容量与并发都远小于 Tomcat 线程池：上游是慢资源，排队比抢线程更诚实。
  jobs:
    capacity: "${AI_JOB_CAPACITY:64}"
    workers: "${AI_JOB_WORKERS:2}"
    max-attempts: "${AI_JOB_MAX_ATTEMPTS:3}"
    retry-base-ms: "${AI_JOB_RETRY_BASE_MS:200}"
    poll-after-ms: "${AI_JOB_POLL_AFTER_MS:500}"
    max-tracked: "${AI_JOB_MAX_TRACKED:512}"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # 关闭 Redis 探活 — spring-boot-starter-data-redis 在 W-Z1 起进了 classpath，
  # 而本机 Redis 是可选的（默认 backend=memory）：RedisHealthIndicator ping 不通时
  # /actuator/health 会 503，smoke 门禁因此空等 240s。上线若要开 redis 后端：
  # MANAGEMENT_HEALTH_REDIS_ENABLED=true（与 season-service 同口径）。
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics,prometheus
