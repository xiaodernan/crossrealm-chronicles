server:
  port: 8083
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 15s
  application:
    name: ai-service
  config:
    # 与 game/season 同一口径：配置中心不在就静默用本地默认值
    import: "optional:configserver:http://localhost:8888"

# 星轨顾问的本地默认（config-server 的 ai-service.yml 是同一套旋钮的上线版本）。
# 唯一不进配置中心的东西是 api-key：密钥只从进程环境变量进，
# 绝不落到配置仓库、镜像层、日志或任何响应体里。
ai-service:
  base-url: "${LLM_BASE_URL:https://api.aizzz.xyz/v1}"
  model: "${LLM_MODEL:gpt-6.2-sol}"
  api-key: "${LLM_API_KEY:}"
  proxy-url: "${LLM_PROXY_URL:}"
  # W-Z519：LLM 总开关。API 因成本/用量关闭 → 默认 false，上游一个字节都不打；
  # 所有 LLM 端点返回 503 (advisor-unavailable)，前端按既有确定性降级路径回退。
  # 密钥本就只从环境变量进，这里关掉开关不需要删密钥；日后 API 恢复设 LLM_ENABLED=true 即可。
  llm-enabled: "${LLM_ENABLED:false}"
  timeout: 20s
  max-retries: 2
  retry-base-ms: 200
  cache-ttl-seconds: 120
  cache-max-entries: 256
  max-question-chars: 400
  max-tokens: 320
  # 分车道上限；未列出的桶沿用 max-tokens。改预算会隔离本地摘要缓存，短回复不再为长文预付 token。
  lane-max-tokens:
    crossrealm-advisor-v1: 320
    crossrealm-ember-v2: 96
    crossrealm-kindle-letter-v1: 96
    crossrealm-boss-verse-v1: 96
    crossrealm-echo-hint-v1: 96
    crossrealm-guide-v1: 192
    crossrealm-arbiter-v1: 384
    crossrealm-oracle-v1: 512
    crossrealm-oracle-deep-v1: 768
    crossrealm-fortune-path-v1: 160
    crossrealm-vigil-vow-v1: 160
    crossrealm-death-epitaph-v1: 64
    crossrealm-chapter-coda-v1: 96
  breaker-threshold: 4
  breaker-cooldown-ms: 15000
  # W-Z490：大前缀车道（v4/v5）是否开机热身。默认 false 省 token——
  # 深潜是低频功能，首问冷一次、次问即热，不必每次开机烧十几万 token 铺页。
  warmup-deep-lanes: "${LLM_WARMUP_DEEP_LANES:false}"
  # W-Z82/W-Z84 · 典籍叩问：BM25 检索注原典段落交给大模型。
  # limit = 喂给模型的原典段落数（封顶 6）；multihop 打开后「复合问题」按标点切子句，
  # 每子句补 2 条未被主检索覆盖的块（总数封顶 limit+2 且绝对 ≤ 6）；关掉即退回单步检索。
  lore:
    limit: 4
    multihop: true
  # W-Y4：慢速 LLM 调用的独立车道（有界队列 + 2 worker + 重试/死信）。
  # 容量与并发都远小于 Tomcat 线程池：上游是慢资源，排队比抢线程更诚实。
  jobs:
    capacity: "${AI_JOB_CAPACITY:64}"
    workers: "${AI_JOB_WORKERS:2}"
    max-attempts: "${AI_JOB_MAX_ATTEMPTS:3}"
    retry-base-ms: "${AI_JOB_RETRY_BASE_MS:200}"
    poll-after-ms: "${AI_JOB_POLL_AFTER_MS:500}"
    max-tracked: "${AI_JOB_MAX_TRACKED:512}"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # 关闭 Redis 探活 — spring-boot-starter-data-redis 在 W-Z1 起进了 classpath，
  # 而本机 Redis 是可选的（默认 backend=memory）：RedisHealthIndicator ping 不通时
  # /actuator/health 会 503，smoke 门禁因此空等 240s。上线若要开 redis 后端：
  # MANAGEMENT_HEALTH_REDIS_ENABLED=true（与 season-service 同口径）。
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics,prometheus
