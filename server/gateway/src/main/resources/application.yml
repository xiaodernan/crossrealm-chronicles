server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 版本信息路由（优先）：/api/version 是个可重试的 GET 端点，给它专用的 Retry 滤镜 —— 顺便把
            # 轮询 / bootstrap 场景从 "一次 503 之后没救" 改成 "最多两次重试，间隔 ≤200ms"。
            - id: game-service-version
              uri: lb://game-service
              order: -1
              predicates:
                - Path=/api/version
              filters:
                - AddRequestHeader=X-Gateway-Source, crossrealm-chronicles-gateway
                - name: CircuitBreaker
                  args:
                    name: gameServiceVersionBreaker
                    fallbackUri: forward:/fallback/503
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 200ms
            # 赛季服务（W-X14）：赛季主题 / 词缀。order=-1 让它先于 Path=/api/** 的主路由命中。
            # 不给 Retry：赛季是 GET，但重试在这里没有收益（周期读数不会因为重试变对），
            # 而 Retry 会掩盖"服务根本没起来"这件事 —— 熔断兜底已经够用。
            - id: season-service
              uri: lb://season-service
              order: -1
              predicates:
                - Path=/api/seasons,/api/seasons/**
              filters:
                - AddRequestHeader=X-Gateway-Source, crossrealm-chronicles-gateway
                - name: CircuitBreaker
                  args:
                    name: seasonServiceBreaker
                    fallbackUri: forward:/fallback/503
            # 游戏伙伴服务：排行榜 / 遥测 / 版本信息
            - id: game-service
              uri: lb://game-service
              predicates:
                - Path=/api/**
              filters:
                - AddRequestHeader=X-Gateway-Source, crossrealm-chronicles-gateway
                # W-X5 熔断：game-service 连续失败达到阈值时快速 503 兜底（FallbackController），
                # 不让错误的上游响应漏给调用方；本地正常跑时熔断器保持 closed。
                - name: CircuitBreaker
                  args:
                    name: gameServiceBreaker
                    fallbackUri: forward:/fallback/503
          discovery:
            locator:
              # 调试用：自动生成 /<service-id>/** 路由（小写服务名）。生产可关掉只走上面显式路由。
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
