server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    # 关停时先停止接收新请求，再给在途请求最多 15 秒慢慢收尾（Linux/systemd 下生效）
    timeout-per-shutdown-phase: 15s
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # 版本信息路由（优先）：/api/version 是个可重试的 GET 端点，给它专用的 Retry 滤镜 —— 顺便把
            # 轮询 / bootstrap 场景从 "一次 503 之后没救" 改成 "最多两次重试，间隔 ≤200ms"。
            - id: game-service-version
              uri: lb://game-service
              order: -1
              predicates:
                - Path=/api/version
              filters:
                - AddRequestHeader=X-Gateway-Source, crossrealm-chronicles-gateway
                - name: CircuitBreaker
                  args:
                    name: gameServiceVersionBreaker
                    fallbackUri: forward:/fallback/503
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    methods: GET
                    backoff:
                      firstBackoff: 50ms
                      maxBackoff: 200ms
            # AI 顾问服务（W-Y1）：唯一持有大模型密钥的进程。
            # 刻意**不给网关层 Retry**：POST 不是幂等的，网关重试会把一次提问放大成两次计费；
            # 重试只发生在 ai-service 内部 —— 那里知道哪些失败值得重试，且带指数退避 + 抖动。
            # fallback 指向支持 POST 的端点（见 FallbackController），否则熔断时 forward 一个
            # 只接 GET 的端点会拿到 405，而不是语义清楚的 503。
            - id: ai-service
              uri: lb://ai-service
              order: -1
              predicates:
                - Path=/api/ai,/api/ai/**
              filters:
                - AddRequestHeader=X-Gateway-Source, crossrealm-chronicles-gateway
                - name: CircuitBreaker
                  args:
                    name: aiServiceBreaker
                    fallbackUri: forward:/fallback/advisor
            # 赛季服务（W-X14）：赛季主题 / 词缀。order=-1 让它先于 Path=/api/** 的主路由命中。
            # 不给 Retry：赛季是 GET，但重试在这里没有收益（周期读数不会因为重试变对），
            # 而 Retry 会掩盖"服务根本没起来"这件事 —— 熔断兜底已经够用。
            - id: season-service
              uri: lb://season-service
              order: -1
              predicates:
                - Path=/api/seasons,/api/seasons/**
              filters:
                - AddRequestHeader=X-Gateway-Source, crossrealm-chronicles-gateway
                - name: CircuitBreaker
                  args:
                    name: seasonServiceBreaker
                    fallbackUri: forward:/fallback/503
            # 在场服务（W-Z-同游）：星轨同游 Real-time 存在感。SSE 长连接，所以这条路由
            # 的熔断限时器必须放很长（默认 1s 会把流直接掐断）；其余短请求走同一熔断器，
            # 失败率超阈值才开路，开路时兜底 503（客户端 EventSource 会自动重连）。
            - id: presence-service
              uri: lb://presence-service
              order: -1
              predicates:
                - Path=/api/presence,/api/presence/**
              filters:
                - AddRequestHeader=X-Gateway-Source, crossrealm-chronicles-gateway
                - name: CircuitBreaker
                  args:
                    name: presenceServiceBreaker
                    fallbackUri: forward:/fallback/503
            # 游戏伙伴服务：排行榜 / 遥测 / 版本信息
            - id: game-service
              uri: lb://game-service
              predicates:
                - Path=/api/**
              filters:
                - AddRequestHeader=X-Gateway-Source, crossrealm-chronicles-gateway
                # W-X5 熔断：game-service 连续失败达到阈值时快速 503 兜底（FallbackController），
                # 不让错误的上游响应漏给调用方；本地正常跑时熔断器保持 closed。
                - name: CircuitBreaker
                  args:
                    name: gameServiceBreaker
                    fallbackUri: forward:/fallback/503
          discovery:
            locator:
              # 调试用：自动生成 /<service-id>/** 路由（小写服务名）。生产可关掉只走上面显式路由。
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # Redis 只在 gateway.ratelimit.backend=redis 时使用；默认不探活（否则 smoke 里没 Redis，health 会一直 DOWN）。
  # 上线切 Redis 限流时：MANAGEMENT_HEALTH_REDIS_ENABLED=true + SPRING_DATA_REDIS_HOST=… + gateway.ratelimit.backend=redis
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,gateway,springcloud,metrics,prometheus
gateway:
  ratelimit:
    # memory = 内存滑动窗口（默认，smoke/CI 用）；redis = Redis 集群共享窗口（多实例生产用）
    backend: memory

# 熔断/限时器显式口径（W-Y1 回填）：reactive circuit breaker 缺省 TimeLimiter 是 1 秒——
# LLM 一轮调用常态 2~30 秒，缺省会把每个 POST 都判成「超时」直接吃回顾问离线页。
# 现在：aiServiceBreaker 限时 75s（覆盖 ai-service 自身 timeout: 20s + 2 次重试 + 退避抖动），
# 熔断窗口 10 次 / 50% 失败率、open 30s 后自动半开——比缺省 100 次窗口更早止损，
# 又不因为一两次上游抖动就开路。其余路由（game-service/season/version）保持缺省 1s，
# 那些端点全部毫秒级返回，缺省对它们是对的。
resilience4j:
  circuitbreaker:
    instances:
      aiServiceBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true
      presenceServiceBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      aiServiceBreaker:
        timeout-duration: 75s
      presenceServiceBreaker:
        # SSE 长连接不能被 1s 缺省掐断；3600s 等于"基本不超时"，只靠断路器本身的失败率开路。
        timeout-duration: 3600s
