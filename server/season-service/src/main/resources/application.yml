server:
  port: 8082
  shutdown: graceful

spring:
  lifecycle:
    # 关停时先停止接收新请求，再给在途请求最多 15 秒慢慢收尾（Linux/systemd 下生效）
    timeout-per-shutdown-phase: 15s
  application:
    name: season-service
  config:
    # 从 config-server 拉集中配置；config-server 不在线时静默回退到本地默认值
    import: "optional:configserver:http://localhost:8888"
  cache:
    # 显式默认：ConcurrentMap（不碰 Redis）。classpath 有 redis 时若不写这个，
    # Spring Boot 会自选 RedisCacheManager 并登记 RedisHealthIndicator ——
    # 本地/CI 无 Redis，健康检查一直 DOWN（smoke 门禁因此卡死）。
    # 上线切 Redis：SPRING_CACHE_TYPE=redis + SPRING_DATA_REDIS_HOST=... 。
    type: simple

# 本地默认（与 config-server 仓库里的 season-service.yml 保持一致）
season-service:
  # 一个赛季多少天 —— 改它等于改赛季长度，不需要改代码
  cycle-days: 14
  # 运维强制指定（留空 = 按周期轮转）
  override: ""

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # classpath 有 spring-boot-starter-data-redis 时，Boot 会登记 RedisHealthIndicator；
  # 没有 Redis 时它会让 health 一直 DOWN。默认关闭探活，上线切 Redis 时
  # MANAGEMENT_HEALTH_REDIS_ENABLED=true 打开。
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,refresh
