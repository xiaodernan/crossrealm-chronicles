server:
  port: 8082

spring:
  application:
    name: season-service
  config:
    # 从 config-server 拉集中配置；config-server 不在线时静默回退到本地默认值
    import: "optional:configserver:http://localhost:8888"

# 本地默认（与 config-server 仓库里的 season-service.yml 保持一致）
season-service:
  # 一个赛季多少天 —— 改它等于改赛季长度，不需要改代码
  cycle-days: 14
  # 运维强制指定（留空 = 按周期轮转）
  override: ""

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
