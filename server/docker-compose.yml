# 跨服王冠 · 在线伙伴服务 —— 一键部署（八容器：discovery / config / game / season / gateway / presence / redis / notify）
# 用法（仓库根目录 server/ 下）：
#   docker compose up --build
# 全栈起来之后：
#   curl http://localhost:8080/api/version
#   curl http://localhost:8080/api/leaderboard
#   curl http://localhost:8080/api/presence/world/count
#   curl http://localhost:8080/api/notify/recent
#
# 注册名刻意不用 localhost：容器间网络用服务名（discovery / config / game-service / season-service
# / presence-service / notification-service / gateway / redis），与单机 smoke 脚本的 localhost 配置是两个世界，不要混。

name: crossrealm-chronicles-server

services:
  discovery:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8761/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  config:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: config
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
    depends_on:
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8888/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  game-service:
    build:
      context: .
      dockerfile: game-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: game-service
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      # 只有 game-service 拉配置；config-server 自己绝不回拉自己（见 scripts/smoke.ps1 注释）
      SPRING_CONFIG_IMPORT: optional:configserver:http://config:8888
      # 幂等提交台账切到 redis（多实例共享、跨实例同 key 同回答；memory=单实例默认）。
      # Spring relaxed binding：game-service.idempotency.backend → GAMESERVICE_IDEMPOTENCY_BACKEND
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      GAMESERVICE_IDEMPOTENCY_BACKEND: redis
    depends_on:
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  season-service:
    build:
      context: .
      dockerfile: season-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: season-service
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      # 与 game-service 同一个口径：只有客户端拉配置，config-server 绝不回拉自己
      SPRING_CONFIG_IMPORT: optional:configserver:http://config:8888
    depends_on:
      config:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  # AI 顾问（W-Y1）：唯一持有大模型密钥的进程。密钥从宿主机环境注入，
  # 镜像层、compose 文件、配置中心里都不写它（见 server/.env.example）。
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ai-service
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config:8888
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      config:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: gateway
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
    depends_on:
      game-service:
        condition: service_healthy
      season-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  # Redis：在场所需的 Pub/Sub + 哈希/集合后端（W-Z-同游）。同时给想切 redis 限流的网关留着。
  # 只在 presence-service 真正用（gateway 默认仍走内存限流，不依赖它）。
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # 在场服务（W-Z-同游）：星轨同游 Real-time 存在感。默认 memory 后端（无 Redis 也健康）；
  # 这里用 PRESENCE_BACKEND=redis 接上面的 redis，真正走 Pub/Sub 扇出。
  presence-service:
    build:
      context: .
      dockerfile: presence-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: presence-service
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config:8888
      PRESENCE_BACKEND: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
    depends_on:
      discovery:
        condition: service_healthy
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8084/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

# 炉火报讯台（W-Z49）：跨微服务的通知 / 广播登记处。默认 memory 后端（无 Redis 也健康）；
# 这里用 SPRING_CACHE_TYPE=redis 接上面的 redis，走 List/Hash 环形台账 + Pub/Sub 广播。
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service
      EUREKA_INSTANCE_PREFERIPADDRESS: "false"
      SPRING_CONFIG_IMPORT: optional:configserver:http://config:8888
      SPRING_CACHE_TYPE: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "true"
    depends_on:
      discovery:
        condition: service_healthy
      config:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8085/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 25s

  # 一次性验证容器：全栈健康后把版本/排行榜/遥测/赛季/ops/在场/报讯 跑一遍并退出（exit 0 = 全绿）
  verify:
    image: curlimages/curl:8.10.1
    depends_on:
      gateway:
        condition: service_healthy
    command: >
      sh -c "set -e;
      echo '== /api/version ==';
      curl -fsS http://gateway:8080/api/version;
      echo; echo '== /api/leaderboard ==';
      curl -fsS http://gateway:8080/api/leaderboard?limit=2;
      echo; echo '== telemetry ==';
      curl -fsS -X POST http://gateway:8080/api/telemetry/events -H 'content-type: application/json' -d '{\"type\":\"smoke\",\"detail\":\"compose\"}';
      echo; curl -fsS http://gateway:8080/api/telemetry/events/count;
      echo; echo '== /api/seasons/active ==';
      curl -fsS http://gateway:8080/api/seasons/active;
      echo; echo '== /api/seasons/stats ==';
      curl -fsS http://gateway:8080/api/seasons/stats;
      echo; echo '== /api/ops/stats ==';
      curl -fsS http://gateway:8080/api/ops/stats;
      echo; echo '== /api/ops/season ==';
      curl -fsS http://gateway:8080/api/ops/season;
      echo; echo '== /api/presence/world/count ==';
      curl -fsS http://gateway:8080/api/presence/world/count;
      echo; echo '== /api/notify/stats ==';
      curl -fsS -X POST http://gateway:8080/api/notify -H 'content-type: application/json' -d '{"kind":"system","title":"compose-smoke","body":"全栈报讯台在线"}';
      echo; curl -fsS http://gateway:8080/api/notify/recent?limit=1;
      echo; curl -fsS http://gateway:8080/api/notify/stats;
      echo; echo '== /actuator/springcloud ==';
      curl -fsS http://gateway:8080/actuator/springcloud;
      echo"
