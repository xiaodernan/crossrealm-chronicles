server:
  port: 8081
  shutdown: graceful

spring:
  lifecycle:
    # 关停时先停止接收新请求，再给在途请求最多 15 秒慢慢收尾（Linux/systemd 下生效）
    timeout-per-shutdown-phase: 15s
  application:
    name: game-service
  # 显式默认：不用 Redis CacheManager 也不注册 RedisHealthIndicator（classpath 有 redis 时才生效）
  # 要开 Redis：SPRING_CACHE_TYPE=redis + SPRING_DATA_REDIS_HOST=... 上线后开
  cache:
    type: simple
  cloud:
    openfeign:
      # 不开这一条，Feign 会**静默忽略** fallbackFactory —— 失败时把异常直接抛给调用方
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # 在线伙伴服务是可选的：下游没起时不该让运维端点等 10 秒
            connectTimeout: 800
            readTimeout: 1200
  config:
    # 从 config-server 拉集中配置；config-server 不在线时静默回退到本地默认值
    import: "optional:configserver:http://localhost:8888"

# 本地默认（与 config-server 仓库里的 game-service.yml 保持一致）
game-service:
  leaderboard:
    seed-demo-data: true
    max-limit: 10
  trial:
    seed-demo-data: true
    max-limit: 10
    max-entries: 500
  telemetry:
    max-events: 500
  version-note: "本地默认配置"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # 关闭 Redis 探活 — Spring Boot 会为 spring-boot-starter-data-redis 自动注册一个 RedisHealthIndicator；
  # Redis 没起或不可达时 health 会当场 FAIL，CI 会挂——比不探更危险。
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,refresh,busrefresh
